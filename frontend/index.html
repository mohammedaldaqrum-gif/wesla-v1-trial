</option><option value="large">كبير</option></select></div><div id="u-shopFields" class="hidden"><label>الحد الائتماني الإجمالي للمحل (د.ل)</label><input id="u-credit" type="number" min="0" step="0.001" value="0"></div><div id="u-vehicleFields" class="hidden"><h4>بيانات المركبة</h4><div class="formgrid"><div><label>فئة المركبة</label><select id="u-vehicle"><option value="">حدد لاحقًا</option><option value="small">حمولة صغيرة</option><option value="medium">حمولة متوسطة</option><option value="large">حمولة كبيرة</option></select></div><div><label>رقم لوحة المركبة</label><input id="u-plate" placeholder="رقم اللوحة" maxlength="24"></div><div><label>الشركة المصنعة (اختياري)</label><input id="u-make" placeholder="مثال: Toyota"></div><div><label>طراز المركبة (اختياري)</label><input id="u-model" placeholder="مثال: Hilux"></div></div><div id="u-rateWrap" class="hidden"><label>أجرة السائق لكل كيلومتر (د.ل/كم) — للمالك فقط</label><input id="u-rate" type="number" min="0.001" step="0.001" placeholder="مثال: 2.500"></div></div><div id="u-jobWrap" class="hidden"><label>المسمى الوظيفي</label><select id="u-job"><option value="accountant">محاسب</option><option value="supervisor">مشرف</option><option value="software_staff">موظف برمجيات</option><option value="other">وظيفة أخرى</option></select><input id="u-jobOther" placeholder="اسم الوظيفة إذا اخترت وظيفة أخرى"></div><div class="card" style="background:#f8fbf9"><h4>الصورة الشخصية وبطاقة العضوية</h4><label>الصورة الشخصية (اختيارية)</label><input id="u-profilePhoto" type="file" accept="image/png,image/jpeg,image/webp"><p class="muted">بطاقة العضوية لا تتضمن جواز السفر أو المعلومات المالية.</p><h4>التحقق من الهوية</h4><label>صورة جواز السفر</label><input id="u-passport" type="file" accept="image/png,image/jpeg,image/webp"><label style="display:flex;gap:8px;align-items:flex-start"><input id="u-passportConsent" type="checkbox" style="width:auto;margin-top:3px"> أؤكد موافقة صاحب الحساب على رفع جوازه وحفظه للتحقق من الهوية.</label></div><button onclick="addUser()">إنشاء الحساب</button><p class="muted">ستظهر كلمة مرور مؤقتة بعد التسجيل؛ يجب تغييرها عند أول دخول.</p>`;}
async function vUsers(){const users=await api('users/list');if(users.error)return toast(users.error,false);userListCache=Array.isArray(users)?users:[];if(!availableRoleDefs.length){const rr=await api('roles/list');if(Array.isArray(rr))availableRoleDefs=rr;}const isOwner=me.role==='owner';$('content').innerHTML=`<h2>قوائم المستخدمين والتصنيفات</h2>${isOwner?`<div class="card">${accountFormMarkup(false)}</div>`:''}<div class="card"><h3>القوائم المستقلة</h3><div class="row no-print"><button class="small" onclick="filterUserList('shop')">المحلات</button><button class="small" onclick="filterUserList('supplier')">موردو الجملة</button><button class="small" onclick="filterUserList('driver')">السائقون</button><button class="small" onclick="filterUserList('rep')">المندوبون</button><button class="small" onclick="filterUserList('employees')">الموظفون</button><button class="small" onclick="filterUserList('service')">مقدمو الخدمات / المشتركون</button></div><div class="row no-print" style="margin-top:8px"><button class="secondary small" onclick="exportUsersExcel(userFilter)">تصدير Excel للقائمة الحالية</button><button class="secondary small" onclick="exportUsersExcel('all')">تصدير جميع المستخدمين</button></div><div id="userCategoryTitle"></div><div id="userListDisplay"></div></div>`;filterUserList(userFilter);roleFields();}
async function vRepRegister(){const users=await api('users/list');if(users.error)return toast(users.error,false);userListCache=Array.isArray(users)?users:[];$('content').innerHTML=`<h2>تسجيل الحسابات ومتابعتها</h2><div class="card">${accountFormMarkup(true)}</div><h3>الحسابات التي سجلتها</h3><div class="section-hint">تظهر لك الحسابات التي أنشأتها أنت فقط؛ لا تظهر حدود الائتمان أو تعرفة السائق أو أرباح المنصة.</div>${users.map(u=>`<div class="card printable-card"><div class="row between"><div style="flex:2"><button class="small secondary" onclick="openUserActionMenu(${u.id})">${esc(u.name)}</button> <span class="badge ${u.active?'green':'redbg'}">${u.active?'فعال':'معطل'}</span>${roleInfo(u)}</div><div class="row no-print"><button class="small secondary" onclick="editUser(${u.id})">تعديل البيانات</button><button class="small secondary" onclick="showMemberCard(${u.id})">بطاقة العضوية</button></div></div></div>`).join('')||'<p class="muted">لا توجد حسابات سجلتها حتى الآن.</p>'}`;roleFields();}
async function addUser(){const role=$('u-role').value,passport=await fileData('u-passport');if(!passport)return toast('ارفع صورة جواز السفر، بحد أقصى 700 كيلوبايت',false);if(!$('u-passportConsent').checked)return toast('يلزم تأكيد موافقة صاحب الحساب على حفظ مستند الهوية',false);const jobVal=$('u-job')?.value||'',jobTitle=jobVal==='other'?($('u-jobOther')?.value||''):jobVal;const payload={name:$('u-name').value.trim(),phone:$('u-phone').value.trim(),role,business_name:$('u-business')?.value||'',contact_name:$('u-contact')?.value||'',contact_phone:$('u-contactPhone')?.value||'',location_url:$('u-location')?.value||'',lat:$('u-lat')?.value||'',lng:$('u-lng')?.value||'',business_size:$('u-businessSize')?.value||'',job_title:jobTitle,credit_limit:me?.role==='owner'?($('u-credit')?.value||0):0,vehicle_type:['driver','rep'].includes(role)?($('u-vehicle')?.value||''):'',license_plate:$('u-plate')?.value||'',vehicle_make:$('u-make')?.value||'',vehicle_model:$('u-model')?.value||'',cost_per_km:me?.role==='owner'&&role==='driver'?($('u-rate')?.value||0):0,passport_image:passport,profile_photo_image:await fileData('u-profilePhoto'),passport_consent:true};const r=await api('users/add',payload);if(r.error)return toast(r.error,false);openModal('تم إنشاء الحساب بنجاح',`<div class="notice"><b>الاسم:</b> ${esc(payload.name)}<br><b>رقم الدخول:</b> ${esc(payload.phone)}<br><b>كلمة المرور المؤقتة:</b> <code>${esc(r.password)}</code><p>يجب تغيير كلمة المرور عند أول دخول. ${r.needs_owner_setup?'سيحدد المالك أجرة توصيل السائق لاحقًا.':''}</p></div><button onclick="closeModal();${me.role==='rep'?'vRepRegister()':'vUsers()'}">تم</button>`);}
function roleInfo(u){const label=ROLES[u.role]||availableRoleDefs.find(x=>x.code===u.role)?.label||u.role;let t=`<div class="muted">${esc(label)} · ${esc(u.phone)}</div>`;if(u.business_name)t+=`<div>النشاط: <b>${esc(u.business_name)}</b></div>`;if(u.contact_name)t+=`<div>مسؤول التواصل: <b>${esc(u.contact_name)}</b> · ${esc(u.contact_phone||'')}</div>`;if(u.location_url)t+=`<div><a class="location" href="${esc(u.location_url)}" target="_blank" rel="noopener">فتح الموقع على Google Maps</a></div>`;if(u.vehicle_type)t+=`<div>فئة المركبة: <b>${({'small':'حمولة صغيرة','medium':'حمولة متوسطة','large':'حمولة كبيرة'})[u.vehicle_type]||esc(u.vehicle_type)}</b>${u.license_plate?' · لوحة السيارة: <b>'+esc(u.license_plate)+'</b>':''}${u.vehicle_make?' · '+esc(u.vehicle_make):''}${u.vehicle_model?' '+esc(u.vehicle_model):''}</div>`;if(me?.role==='owner'&&u.role==='driver')t+=`<div>أجرة الكيلومتر: <b>${Number(u.cost_per_km_dinar||0).toFixed(3)} د.ل/كم</b></div>`;if(me?.role==='owner'&&u.role==='shop')t+=`<div>الحد الائتماني المعتمد: <b>${fmt(u.credit_limit_dinar)}</b></div>`;if(me?.role==='owner'&&u.creator_name)t+=`<div class="muted">سُجّل بواسطة: ${esc(u.creator_name)}</div>`;return t;}

async function recordTreasuryDeposit(){const amount=$('treasury-amount')?.value,method=$('treasury-method')?.value,purpose=$('treasury-purpose')?.value,note=$('treasury-note')?.value;const r=await api('cash-custody/treasury-deposit',{amount,method,purpose,note});if(r.error)return toast(r.error,false);toast('سُجل المبلغ في الخزينة كعهدة واردة #'+r.id);vCustody();}
boot();

// نظام العهود/التعهدات المالية
async function vPromises(){
 if(['owner','accountant'].includes(me.role)){
  const rows=await api('promises/list');if(rows.error)return toast(rows.error,false);
  const users=await api('users/list');if(users.error)return toast(users.error,false);
  const shops=users.filter(x=>x.role==='shop'&&x.active);
  const suppliers=users.filter(x=>x.role==='supplier'&&x.active);
  $('content').innerHTML=`<h2>إدارة العهود والتعهدات المالية</h2><div class="card"><h3>إنشاء عهدة جديدة</h3><div class="formgrid"><div><label>المحل</label><select id="promise-shop">${shops.map(x=>`<option value="${x.id}">${esc(x.business_name||x.name)} · ${esc(x.phone)}</option>`).join('')}</select></div><div><label>المورد</label><select id="promise-supplier">${suppliers.map(x=>`<option value="${x.id}">${esc(x.business_name||x.name)} · ${esc(x.phone)}</option>`).join('')}</select></div><div><label>المبلغ (د.ل)</label><input id="promise-amount" type="number" min="0.001" step="0.001"></div><div><label>تاريخ الاستحقاق</label><input id="promise-due" type="date"></div><div><label>ملاحظة</label><input id="promise-note" placeholder="اختياري"></div></div><button onclick="createPromise()">إنشاء العهدة</button></div><h3>العهود المسجلة</h3>${rows.map(p=>`<div class="card printable-card"><div class="row between"><b>عهدة #${p.id} · ${esc(p.shop_business||p.shop_name)} ← ${esc(p.supplier_business||p.supplier_name)}</b><span class="badge ${p.status==='pending'?'yellow':p.status==='confirmed'?'bluebg':p.status==='fulfilled'?'green':'redbg'}">${{pending:'بانتظار التأكيد',confirmed:'مؤكدة',fulfilled:'منفذة',cancelled:'ملغاة'}[p.status]||p.status}</span></div><p class="muted">المبلغ: <b>${fmt(p.amount)}</b> · تستحق في ${esc(p.due_date)} · ${esc(p.note||'')}</div><div class="row no-print"><button onclick="updatePromise(${p.id},'confirmed')">تأكيد</button><button onclick="updatePromise(${p.id},'fulfilled')">تنفيذ</button><button class="danger" onclick="updatePromise(${p.id},'cancelled')">إلغاء</button><button class="small secondary" onclick="printCard(this)">طباعة</button></div></div>`).join('')||'<div class="card">لا توجد عهود.</div>'}`;
  return;
 }
 if(me.role==='shop'||me.role==='supplier'){
  const rows=await api('promises/list');if(rows.error)return toast(rows.error,false);
  $('content').innerHTML=`<h2>العهود والتعهدات الخاصة بي</h2>${rows.map(p=>`<div class="card printable-card"><div class="row between"><b>عهدة #${p.id} · ${me.role==='shop'?esc(p.supplier_business||p.supplier_name):esc(p.shop_business||p.shop_name)}</b><span class="badge ${p.status==='pending'?'yellow':p.status==='confirmed'?'bluebg':p.status==='fulfilled'?'green':'redbg'}">${{pending:'بانتظار التأكيد',confirmed:'مؤكدة',fulfilled:'منفذة',cancelled:'ملغاة'}[p.status]||p.status}</span></div><p class="muted">المبلغ: <b>${fmt(p.amount)}</b> · تاريخ الاستحقاق: ${esc(p.due_date)}</p><p>${esc(p.note||'')}</p><button class="small secondary" onclick="printCard(this)">طباعة</button></div>`).join('')||'<div class="card">لا توجد عهود مسجلة.</div>'}`;
 }
}
async function createPromise(){
 const shop_id=Number($('promise-shop')?.value),supplier_id=Number($('promise-supplier')?.value),amount=$('promise-amount')?.value,due_date=$('promise-due')?.value,note=$('promise-note')?.value||'';
 if(!shop_id||!supplier_id||!amount||amount<=0||!due_date)return toast('أدخل بيانات العهدة بشكل صحيح',false);
 const r=await api('promises/create',{shop_id,supplier_id,amount,due_date,note});if(r.error)return toast(r.error,false);
 toast('تم إنشاء العهدة بنجاح');$('promise-amount').value=$('promise-due').value=$('promise-note').value='';vPromises();
}
async function updatePromise(id,status){
 if(!confirm('تأكيد تغيير حالة العهدة إلى: '+status))return;
 const note=prompt('ملاحظة (اختياري):','')||'';
 const r=await api('promises/update',{id,status,note});if(r.error)return toast(r.error,false);
 toast('تم تحديث حالة العهدة');vPromises();
}
</script></body></html>
