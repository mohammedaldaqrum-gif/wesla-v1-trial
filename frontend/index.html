;object-fit:cover;border-radius:12px;border:1px solid var(--line)}.brand-mark{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:11px;background:#d9f99d;color:#064b3a;font-size:20px;font-weight:900;margin-left:9px;vertical-align:middle}.section-hint{background:linear-gradient(110deg,#e8f7ef,#f6fbf8);border:1px solid #d7eee2;border-radius:14px;padding:13px 16px;margin-bottom:14px;color:#285a47}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.bar{height:10px;background:#e3ece8;border-radius:99px;overflow:hidden}.bar>div{height:100%;background:var(--g)}.notice{padding:12px;border-radius:10px;background:#f0fdf4;border:1px solid #bbf7d0;margin:10px 0}.notice.warn{background:#fffbeb;border-color:#fde68a}.notice.bad{background:#fef2f2;border-color:#fecaca}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:600px}th,td{text-align:right;padding:10px;border-bottom:1px solid var(--line);vertical-align:top}th{background:#f8fbf9;color:#52635d;font-size:13px}.location{color:var(--blue);text-decoration:none}.location:hover{text-decoration:underline}.itemimg{width:76px;height:76px;object-fit:contain;border:1px solid var(--line);border-radius:10px}.smalltext{font-size:12px;color:var(--muted)}.jobfees{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:10px}.jobfees div{background:#f7faf8;border:1px solid var(--line);padding:9px;border-radius:9px}.jobfees b{display:block;margin-top:4px}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#17392d;color:white;border-radius:12px;padding:12px 18px;z-index:20;max-width:90vw}.toast.err{background:var(--red)}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:18px;z-index:30}.modalbox{background:white;border-radius:14px;padding:18px;max-width:600px;max-height:90vh;overflow:auto;width:100%}.modal img{max-width:100%;max-height:70vh;object-fit:contain}.print-cont <div id="login" class="login hidden"><h1>وِصلة جملة</h1><p class="muted">سوق الجملة · النقل · الفواتير · متابعة التحصيل</p><label>رقم الهاتف</label><input id="phone" inputmode="numeric" autocomplete="username"><label>كلمة المرور</label><input id="password" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()"><button style="width:100%" onclick="login()">تسجيل الدخول</button></div>
<div id="changePw" class="login hidden"><h2>تغيير كلمة المرور</h2><p class="muted">يجب تغيير كلمة المرور المؤقتة قبل استعمال النظام.</p><input id="oldPw" type="password" placeholder="كلمة المرور الحالية"><input id="newPw" type="password" placeholder="كلمة المرور الجديدة (8 خانات على الأقل)"><button style="width:100%" onclick="changePw()">حفظ</button></div>
<div id="app" class="hidden"><header><b><span class="brand-mark">و</span>وِصلة جملة <small style="opacity:.75">V4.9</small> · <span id="roleName"></span></b><div class="header-actions"><button class="header-link" id="userName" onclick="openHeaderAccount()" title="الحساب وبطاقة العضوية"></button><button class="header-link" onclick="go('notifications')">🔔 الإشعارات <span id="notifCount" class="notif-badge hidden">0</span></button><a onclick="logout()">خروج</a></div></header><nav id="nav"></nav><main id="content"></main></div>
<div id="toast" class="toast hidden"></div><div id="modal" class="modal hidden" onclick="if(event.target===this)closeModal()"><div class="modalbox"><div class="row between"><h3 id="modalTitle">عرض</h3><button class="secondary small" onclick="closeModal()">إغلاق</button></div><div id="modalBody"></div></div></div>
<script>
'use strict';
let me=null,tab='',products=[],cart=[],timer=null,driverPoll=null,deliveryMode='delivery',vehicleChoice='supplier',collectionMethod='cash',settings={platform_fee_percent:3,route_factor:1.25},userListCache=[],userFilter='shop',availableRoleDefs=[],notifTimer=null,lastNotificationId=0;
const $=id=>document.getElementById(id),ROLES={owner:'المالك',supplier:'تاجر الجملة',shop:'المحل التجاري',driver:'السائق',rep:'المندوب',accountant:'المحاسب',supervisor:'المشرف',service_provider:'مقدم خدمة',subscriber:'مشترك',software_staff:'موظف برمجيات'},ST={pending:'بانتظار المورد',ready:'جاهز للإسناد',shipping:'قيد التوصيل',delivered:'تم التسليم',cancelled:'ملغي',stopped:'موقوف',returned:'تم الإرجاع'};
const TABS={
 owner:[['stats','الرئيسية'],['settings','إعدادات الأرباح'],['users','المستخدمون'],['roles','الأدوار والصلاحيات'],['reps','إسناد المندوبين'],['deliveries','التوصيل والمكاسب'],['custody','الخزينة والعهد'],['remittances','توريد مستحقات الموردين'],['payouts','صرف المستحقات'],['orders','الطلبات'],['invoices','الفواتير'],['collections','التحصيل'],['debtPayments','طلبات تسديد الدين'],['claims','مطالبات الديون'],['promises','العهود والتعهدات'],['requests','طلبات الإلغاء والإرجاع'],['notifications','الإشعارات'],['profile','حسابي والعضوية']],
 supplier:[['orders','الطلبات'],['products','المنتجات والمخزون'],['invoices','الفواتير والتحصيل'],['remittances','تحويلات مستحقاتي'],['collections','مراجعة التحصيل'],['debtPayments','طلبات تسديد الدين'],['claims','مطالبة بدين'],['promises','العهود والتعهدات'],['users','المستخدمون'],['notifications','الإشعارات'],['profile','حسابي والعضوية']],
 shop:[['market','السوق والسلة'],['orders','طلباتي'],['invoices','فواتيري وديوني'],['debtPayments','تسديد الدين'],['promises','العهود والتعهدات'],['requests','طلبات الإلغاء والإرجاع'],['users','المستخدمون'],['notifications','الإشعارات'],['profile','حسابي والعضوية']],
 driver:[['orders','مهام التوصيل'],['earnings','مستحقاتي'],['custody','العهد النقدية'],['payouts','صرف مستحقاتي'],['claims','مطالبات الديون'],['users','المستخدمون'],['notifications','الإشعارات'],['profile','حسابي والعضوية']],
 rep:[['profile','حسابي والعضوية'],['register','تسجيل الحسابات'],['shops','المحال المسندة'],['collections','تقارير التحصيل'],['earnings','مكاسبي ومكافآتي'],['custody','العهد النقدية'],['remittances','تسليم مستحقات الموردين'],['payouts','صرف مستحقاتي'],['claims','مطالبات الديون'],['users','المستخدمون'],['notifications','الإشعارات']],
 accountant:[['profile','حسابي والعضوية'],['custody','الخزينة والعهد'],['remittances','توريد مستحقات الموردين'],['payouts','صرف المستحقات'],['orders','متابعة العمليات المالية'],['invoices','الفواتير'],['collections','التحصيل'],['debtPayments','طلبات تسديد الدين'],['claims','مطالبات الديون'],['promises','العهود والتعهدات'],['requests','طلبات الموافقة'],['users','تصدير قوائم الحسابات'],['notifications','الإشعارات']],
 service_provider:[['profile','حسابي والعضوية'],['orders','الطلبات المسندة'],['requests','إلغاء وإيقاف وإرجاع'],['users','المستخدمون'],['notifications','الإشعارات']],
 subscriber:[['profile','حسابي والعضوية'],['orders','الطلبات المسندة'],['requests','إلغاء وإيقاف وإرجاع'],['users','المستخدمون'],['notifications','الإشعارات']],
 supervisor:[['profile','حسابي والعضوية'],['users','المستخدمون'],['notifications','الإشعارات']],
 software_staff:[['profile','حسابي والعضوية'],['users','المستخدمون'],['notifications','الإشعارات']]
};
const fmt=n=>(Number(n||0)/1000).toLocaleString('en-US',{minimumFractionDigits:3,maximumFractionDigits:3})+' د.ل', esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function api(p,d={}){try{const r=await fetch('/api/'+p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});const data=await r.json();if(r.status===401&&p!=='me'){showOnly('login');}if(data.must_change&&p!=='me'&&p!=='password/change')showOnly('changePw');return data;}catch(e){return{error:'تعذر الاتصال بالخادم'};}}
function toast(s,ok=true){$('toast').textContent=s;$('toast').classList.toggle('hidden',false);$('toast').classList.toggle('err',!ok);clearTimeout(timer);timer=setTimeout(()=>$('toast').classList.add('hidden'),4000)}
async function act(p,d,msg,after){const r=await api(p,d);if(r.error){toast(r.error,false);return r;}toast(msg||'تمت العملية');if(after)await after(r);return r;}
function showOnly(id){['login','changePw','app'].forEach(x=>$(x).classList.toggle('hidden',x!==id));}
function openModal(title,html){$('modalTitle').textContent=title;$('modalBody').innerHTML=html;$('modal').classList.remove('hidden');}function closeModal(){$('modal').classList.add('hidden');}
async function boot(){const roles=await api('roles/list');if(Array.isArray(roles))availableRoleDefs=roles;const r=await api('me');if(r.success)enter(r);else showOnly('login');}
function enter(r){me=r.user;if(r.must_change){showOnly('changePw');return;}showOnly('app');$('roleName').textContent=ROLES[me.role]||availableRoleDefs.find(x=>x.code===me.role)?.label||me.role;$('userName').textContent=me.name;$('nav').innerHTML=(TABS[me.role]||TABS.subscriber).map(([k,l])=>`<button id="tab-${k}" onclick="go('${k}')">${l}</button>`).join('');go((TABS[me.role]||TABS.subscriber)[0][0]);refreshNotificationCount(true);startNotificationPolling();}
async function login(){const r=await api('login',{phone:$('phone').value.trim(),password:$('password').value});if(r.error||!r.success)return toast(r.error||r.msg||'تعذر الدخول',false);enter(r);}
async function logout(){if(notifTimer)clearInterval(notifTimer);notifTimer=null;await api('logout');me=null;showOnly('login');}
async function changePw(){const r=await api('password/change',{old:$('oldPw').value,new:$('newPw').value});if(r.error)return toast(r.error,false);toast('تم تغيير كلمة المرور');$('oldPw').value=$('newPw').value='';




















boot();}
function go(k){tab=k;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.id==='tab-'+k));render();}
async function render(){if(me?.role==='driver'&&tab==='orders'){await vDriverJobs();ensurePrintButton();return;}const f={profile:vProfile,stats:vStats,users:vUsers,roles:vRoles,settings:vSettings,reps:vReps,deliveries:vDeliveries,custody:vCustody,remittances:vRemittances,payouts:vPayouts,orders:vOrders,invoices:vInvoices,collections:vCollections,products:vProducts,market:vMarket,shops:vRepShops,earnings:vEarnings,debtPayments:vDebtPayments,claims:vClaims,promises:vPromises,register:vRepRegister,requests:vChangeRequests,notifications:vNotifications}[tab];if(f)await f();ensurePrintButton();}
function ensurePrintButton(){const c=$('content');if(c&&!$('printPageBtn'))c.insertAdjacentHTML('afterbegin','<div class="print-control no-print"><button id="printPageBtn" class="secondary small" onclick="window.print()">طباعة الصفحة / التقرير</button></div>');}
const printObserver=new MutationObserver(()=>ensurePrintButton());printObserver.observe($('content'),{childList:true});
function printCard(btn){const card=btn.closest('.printable-card');if(!card)return window.print();const w=window.open('','_blank','width=900,height=700');if(!w)return toast('اسمح بالنوافذ المنبثقة للطباعة',false);w.document.write('<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>طباعة</title><style>body{font-family:Tahoma,Arial;padding:24px;direction:rtl;color:#15392d}button{display:none!important}.card{border:1px solid #ccc;padding:16px;margin:10px 0;break-inside:avoid}.jobfees{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.jobfees div{border:1px solid #ddd;padding:8px}h3{margin:0 0 12px}.membership-card{max-width:760px;border:2px solid #087f5b;border-radius:18px;overflow:hidden;margin:auto;background:#f4faf6}.membercard-head{background:#064b3a;color:#fff;padding:18px;display:flex;justify-content:space-between;align-items:center}.membercard-head h2{color:white;margin:0}.membercard-body{padding:22px;display:grid;grid-template-columns:1fr 130px;gap:18px}.member-photo{width:120px;height:140px;object-fit:cover;border:1px solid #ccc;border-radius:10px}.member-field{padding:7px 0;border-bottom:1px solid #ddd}.member-field small{display:block;color:#555}.member-code{color:#087f5b;font-weight:bold}</style></head><body>'+card.outerHTML+'</body></html>');w.document.close();w.focus();setTimeout(()=>{w.print();w.close();},250);}
async function vProfile(){
 const r=await api('me');if(r.error)return toast(r.error,false);me=r.user;
 const ph=await api('users/profile-photo',{id:me.id});const photo=ph.success&&ph.image?ph.image:'';
 const vehicleNamesLocal={small:'حمولة صغيرة',medium:'حمولة متوسطة',large:'حمولة كبيرة'};
 $('content').innerHTML=`<h2>حسابي وبطاقة العضوية</h2>
 <div class="card"><div class="row" style="align-items:flex-start"><div>${photo?`<img class="profile-avatar" src="${photo}" alt="الصورة الشخصية">`:`<div class="profile-avatar" style="display:grid;place-items:center;font-size:34px;font-weight:800;color:var(--g)">${esc((me.name||'و').slice(0,1))}</div>`}</div><div style="flex:3"><h3>${esc(me.name)}</h3><span class="badge green">${esc(ROLES[me.role]||me.role)}</span><p class="muted">رقم العضوية: ${esc(me.member_code||('WS-'+String(me.id).padStart(6,'0')))}</p><p class="muted">هذه معلومات حسابك. مستند الهوية منفصل عن بطاقة العضوية ولا يُطبع عليها.</p></div></div>

async function vStats(){const [s,stg]=await Promise.all([api('stats'),api('settings/get')]);if(s.error)return toast(s.error,false);if(stg.error)return toast(stg.error,false);settings=stg;const count=(r)=>Number((s.users||[]).find(x=>x.role===r)?.n||0),st=(x)=>Number((s.orders||[]).find(y=>y.status===x)?.n||0);$('content').innerHTML=`<h2>لوحة المالك الرئيسية — التحكم في المنصة</h2><div class="owner-shortcuts no-print"><button onclick="go('settings')">إعدادات الأرباح</button><button class="secondary" onclick="go('users')">إدارة الحسابات</button><button class="secondary" onclick="go('custody')">العهد المالية</button><button class="secondary" onclick="go('remittances')">توريد مستحقات الموردين</button><button class="secondary" onclick="go('payouts')">صرف مستحقات السائقين والمندوبين</button></div>${ownerSettingsForm(stg,true)}<div class="grid"><div class="card stat"><b>${fmt(s.sales)}</b>إجمالي قيمة الفواتير</div><div class="card stat"><b style="color:var(--red)">${fmt(s.debt)}</b>الدين غير المسدد</div><div class="card stat"><b>${fmt(s.appProfit)}</b>مكاسب التطبيق الصافية المحققة</div><div class="card stat"><b>${fmt(s.projectedAppProfit||0)}</b>مكاسب متوقعة من الشحنات المسندة غير المكتملة</div><div class="card stat"><b>${fmt(s.appRevenue||0)}</b>دخل المنصة المسجل من المنتجات</div><div class="card stat"><b>${fmt(s.driverEarnings)}</b>مستحقات توصيل السائقين المكتملة</div><div class="card stat"><b>${fmt(s.cashHeld||0)}</b>إجمالي العهد النقدية غير المغلقة</div><div class="card stat"><b>${fmt(s.supplierRemittancePending||0)}</b>مبالغ بانتظار توريد/تأكيد المورد</div><div class="card stat"><b>${count('shop')} / ${count('supplier')}</b>محال / موردون</div><div class="card stat"><b>${count('driver')} / ${count('rep')}</b>سائقون / مندوبون</div><div class="card stat"><b>${st('pending')+st('ready')+st('shipping')}</b>طلبات قيد التنفيذ</div></div><h3>تقادم الديون المستحقة</h3><div class="grid">${['0-30','31-60','61-90','90+'].map(k=>{const x=(s.aging||[]).find(a=>a.bucket===k);const labels={'0-30':'0–30 يومًا','31-60':'31–60 يومًا','61-90':'61–90 يومًا','90+':'أكثر من 90 يومًا'};return `<div class="card stat"><b>${fmt(x?.amount||0)}</b>${labels[k]}</div>`;}).join('')}</div><div class="notice warn">الأرقام المالية والتزامات العهد مؤشرات تشغيلية. العهد لا تعتبر مسلّمة حتى يؤكد الطرف المستلم، والمبالغ المستحقة للمورد لا تغلق إلا بعد تأكيد المورد.</div>`;}
function roleFields(){const r=$('u-role')?.value||'shop';['u-businessFields','u-shopFields','u-vehicleFields','u-rateWrap','u-sizeWrap','u-jobWrap'].forEach(id=>$(id)?.classList.add('hidden'));if(['shop','supplier'].includes(r))$('u-businessFields')?.classList.remove('hidden');if(['shop','supplier'].includes(r))$('u-sizeWrap')?.classList.remove('hidden');if(r==='shop'&&me?.role==='owner')$('u-shopFields')?.classList.remove('hidden');if(['driver','rep'].includes(r))$('u-vehicleFields')?.classList.remove('hidden');if(r==='driver'&&me?.role==='owner')$('u-rateWrap')?.classList.remove('hidden');if(['accountant','supervisor','software_staff'].includes(r)||(!ROLES[r]&&r))$('u-jobWrap')?.classList.remove('hidden');if($('u-contactLabel'))$('u-contactLabel').textContent=r==='supplier'?'اسم مندوب المبيعات':'اسم مندوب المشتريات';if($('u-rateNote'))$('u-rateNote').textContent='لا تُعرض أجرة السائق إلا للمالك والسائق نفسه.';}


function filterUserList(filter){userFilter=filter;const labels={shop:'المحلات',supplier:'موردو الجملة',driver:'السائقون',rep:'المندوبون',employees:'الموظفون',service:'مقدمو الخدمات والمشتركون',all:'كل المستخدمين'};const match=u=>filter==='all'||(filter==='employees'?['accountant','supervisor','software_staff'].includes(u.role):filter==='service'?['service_provider','subscriber'].includes(u.role):u.role===filter);const rows=userListCache.filter(match);if(!$('userCategoryTitle'))return;$('userCategoryTitle').innerHTML=`<h3 style="margin-top:16px">${labels[filter]||filter} (${rows.length})</h3>`;$('userListDisplay').innerHTML=rows.map(u=>`<div class="card printable-card"><div class="row between"><div style="flex:2"><button class="small secondary" onclick="openUserActionMenu(${u.id})">${esc(u.name)}</button> <span class="badge ${u.active?'green':'redbg'}">${u.active?'فعال':'معطل'}</span>${roleInfo(u)}<div class="muted">التصنيف: ${esc(u.business_size||u.job_title||'—')} · تاريخ التسجيل: ${esc(u.created_at||'—')}</div></div><div class="row no-print" style="flex:1;min-width:180px">${me.role==='owner'?`<button class="small secondary" onclick="editUser(${u.id})">تعديل البيانات</button>${u.has_passport?`<button class="small secondary" onclick="viewPassport(${u.id})">عرض جواز السفر</button>`:''}<button class="small secondary" onclick="resetUser(${u.id})">إعادة كلمة المرور</button>${u.role==='shop'?`<button class="small amber" onclick="setLimit(${u.id},${Number(u.credit_limit_dinar||0)})">تعديل الحد الائتماني</button>`:''}<button class="small ${u.active?'danger':'blue'}" onclick="toggleUser(${u.id})">${u.active?'تعطيل الحساب':'تفعيل الحساب'}</button>`:''}<button class="small secondary" onclick="showMemberCard(${u.id})">بطاقة العضوية</button><button class="small secondary" onclick="printCard(this)">طباعة البطاقة / السجل</button></div></div></div>`).join('')||'<div class="notice">لا توجد حسابات في هذه الفئة.</div>';}
function exportUsersExcel(filter){const labels={shop:'المحلات',supplier:'موردو الجملة',driver:'السائقون',rep:'المندوبون',employees:'الموظفون',service:'مقدمو الخدمات والمشتركون',all:'جميع المستخدمين'};const match=u=>filter==='all'||(filter==='employees'?['accountant','supervisor','software_staff'].includes(u.role):filter==='service'?['service_provider','subscriber'].includes(u.role):u.role===filter);const rows=userListCache.filter(match);const phone=x=>String(x.phone||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');const role=(x)=>esc(ROLES[x.role]||availableRoleDefs.find(r=>r.code===x.role)?.label||x.role);const tr=rows.map(u=>`<tr><td>${esc(u.name)}</td><td style="mso-number-format:'\@';">${phone(u)}</td><td>${esc(u.business_size||u.job_title||'—')}</td><td>${role(u)}</td><td>${esc(u.created_at||'')}</td></tr>`).join('');const html=`<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><style>body{font-family:Tahoma;direction:rtl}table{border-collapse:collapse;width:100%}th{background:#087f5b;color:#fff;padding:10px;border:1px solid #ddd}td{padding:8px;border:1px solid #ddd;mso-number-format:'\@'}tr:nth-child(even){background:#f2f8f5}</style></head><body><h2>وِصلة جملة — ${labels[filter]||'قائمة المستخدمين'}</h2><table dir="rtl"><thead><tr><th>الاسم</th><th>الهاتف</th><th>التصنيف</th><th>الدور</th><th>تاريخ التسجيل</th></tr></thead><tbody>${tr}</tbody></table></body></html>`;const blob=new Blob(['\ufeff',html],{type:'application/vnd.ms-excel;charset=utf-8;'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`WESLA_${filter}_${new Date().toISOString().slice(0,10)}.xls`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}


async function fileData(id){const f=$(id)?.files?.[0];if(!f)return '';if(!/^image\/(png|jpeg|webp)$/.test(f.type)){toast('اختر صورة PNG أو JPG أو WEBP',false);return '';}if(f.size>700000){toast('حجم الصورة يجب ألا يتجاوز 700 كيلوبايت',false);return '';}return await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(f);});}

le" accept="image/png,image/jpeg,image/webp"></div></div><button onclick="saveEditUser(${x.id},'${x.role}')">حفظ التعديلات</button>`);}
async function saveEditUser(id,role){const payload={id,business_name:$('edit-business')?.value||'',contact_name:$('edit-contact')?.value||'',contact_phone:$('edit-phone')?.value||'',location_url:$('edit-location')?.value||'',lat:$('edit-lat')?.value||'',lng:$('edit-lng')?.value||''};if(['driver','rep'].includes(role)){payload.vehicle_type=$('edit-vehicle')?.value||'';payload.license_plate=$('edit-plate')?.value||'';payload.vehicle_make=$('edit-make')?.value||'';payload.vehicle_model=$('edit-model')?.value||'';if(me.role==='owner'&&role==='driver')payload.cost_per_km=$('edit-rate')?.value||0;}const img=await fileData('edit-passport');if(img)payload.passport_image=img;const photo=await fileData('edit-profilePhoto');if(photo)payload.profile_photo_image=photo;const r=await api('users/profile/update',payload);if(r.error)return toast(r.error,false);closeModal();toast('تم تحديث البيانات');me.role==='rep'?vRepRegister():vUsers();}

async function vMarket(){const r=await api('products/all');if(r.error)return toast(r.error,false);products=r;const c=await api('orders/get');const credit=c.credit||{limit:0,debt:0,reserved:0,available:0};$('content').innerHTML=`<h2>سوق الجملة والسلة</h2><div class="card"><div class="grid"><div class="stat"><b>${fmt(credit.limit)}</b>الحد الائتماني</div><div class="stat"><b>${fmt(credit.debt)}</b>الدين القائم</div><div class="stat"><b>${fmt(credit.reserved)}</b>حجوزات آجلة جارية</div><div class="stat"><b>${fmt(Math.max(0,credit.available))}</b>المتاح للشراء بالآجل</div></div></div><div class="card"><label>بحث عن منتج</label><input id="searchProduct" placeholder="اكتب اسم المنتج أو SKU" oninput="filterProducts()"></div><div id="productGrid" class="grid"></div><div id="cartPanel" class="card"></div>`;drawProducts(products);drawCart();}
function drawProducts(list){$('productGrid').innerHTML=list.map(p=>`<div class="card">${p.image_url?`<img class="imgprod" src="${esc(p.image_url)}" alt="${esc(p.name)}">`:`<div class="imgprod" style="display:grid;place-items:center;color:#94a3b8">صورة المنتج غير متوفرة</div>`}<h3>${esc(p.name)}</h3><div class="muted">المورد: ${esc(p.supplier_business||p.supplier_name)}</div><div class="price">${fmt(p.shop_price)} <span class="muted">سعر البيع النهائي للمحل</span></div><div><span class="badge ${p.credit_allowed?'green':'redbg'}">سياسة المورد — فاتورة بفاتورة: ${p.credit_allowed?'مسموح':'غير مسموح'}</span> <span class="badge ${p.credit_locked?'redbg':'green'}">${p.credit_locked?'الشراء الآجل مقفول لحسابك':'الشراء الآجل غير مقفول لحسابك'}</span></div><div class="muted">SKU: ${esc(p.sku)} · المخزون: ${p.stock}</div>${p.supplier_location?`<div><a class="location" target="_blank" rel="noopener" href="${esc(p.supplier_location)}">موقع المورد</a></div>`:''}<div class="notice" style="font-size:12px">السعر النهائي المعروض للمحل؛ لا تظهر تفاصيل التسعير الداخلي في فاتورة المحل. ${p.distance_estimate_km==null?'للتوصيل، أكمل إحداثيات المحل والمورد.':`المسافة التقديرية ${Number(p.distance_estimate_km).toFixed(1)} كم؛ تحسب أجرة النقل بصورة مستقلة حسب فئة السيارة.`}</div><div class="row"><div><label>الكمية</label><input id="qty-${p.id}" type="number" min="1" max="${p.stock}" value="1"></div><div><label>الدفع</label><select id="method-${p.id}"><option value="cash">نقدي عند التسليم</option><option value="credit" ${(p.credit_allowed&&!p.credit_locked)?"":"disabled"}>آجل</option></select></div></div><button style="width:100%" ${p.stock>0?'':'disabled'} onclick="addCart(${p.id})">إضافة للسلة</button></div>`).join('')||'<p class="muted">لا توجد منتجات مطابقة.</p>';}
function filterProducts(){const q=$('searchProduct').value.toLowerCase();drawProducts(products.filter(p=>(p.name+' '+p.sku+' '+p.supplier_name+' '+p.supplier_business).toLowerCase().includes(q)));}
function addCart(id){const p=products.find(x=>x.id===id),qty=Number($('qty-'+id).value),method=$('method-'+id).value;if(!p||!Number.isInteger(qty)||qty<1||qty>p.stock)return toast('أدخل كمية صحيحة ضمن المخزون',false);if(method==='credit'&&p.credit_locked)return toast('هذا المنتج مقفول للشراء الآجل؛ يمكنك اختياره نقدًا فقط.',false);const old=cart.find(x=>x.product_id===id);if(old){if(old.qty+qty>p.stock)return toast('الكمية تتجاوز المخزون',false);old.qty+=qty;old.method=method;}else cart.push({product_id:id,qty,method});drawCart();toast('أضيف المنتج إلى السلة');}
function removeCart(id){cart=cart.filter(x=>x.product_id!==id);drawCart();}
const vehicleNames={small:'حمولة صغيرة',medium:'حمولة متوسطة',large:'حمولة كبيرة',supplier:'يحدد المورد'};
function drawCart(){
 const box=$('cartPanel');if(!box)return;
 const rows=cart.map(x=>({...x,p:products.find(p=>p.id===x.product_id)})).filter(x=>x.p),groups={};
 rows.forEach(x=>{const k=x.p.supplier_id;if(!groups[k])groups[k]={supplier:x.p.supplier_business||x.p.supplier_name,goods:0,items:[],dist:x.p.distance_estimate_km,delivery:0,unknown:false};groups[k].goods+=Number(x.p.shop_price||0)*x.qty;groups[k].items.push(x);if(x.p.distance_estimate_km==null)groups[k].unknown=true;});
 let goods=rows.reduce((a,x)=>a+Number(x.p.shop_price||0)*x.qty,0),delivery=0,unknown=false;
 for(const g of Object.values(groups)){
  if(deliveryMode==='delivery'){
   const key=vehicleChoice==='supplier'?'supplier':vehicleChoice;
   const quote=g.items[0]?.p?.delivery_quotes?.[key];
   if(g.unknown||quote==null||!Number.isFinite(Number(quote))||Number(quote)<=0){g.unknown=true;unknown=true;}
   else g.delivery=Number(quote); // One transport fee per supplier group, regardless of number of products.
   delivery+=g.delivery;
  }
 }
 const rowHtml=rows.map(x=>{const unit=Number(x.p.shop_price||0),line=unit*x.qty;return `<div class="row between" style="padding:9px 0;border-bottom:1px solid var(--line)"><div style="flex:3"><b>${esc(x.p.name)}</b><div class="muted">${esc(x.p.supplier_business||x.p.supplier_name)} · ${x.qty} × ${fmt(unit)} (سعر البيع النهائي للمحل) · ${x.method==='credit'?'آجل':'نقدي'} ${x.p.credit_locked&&x.method==='cash'?'<span class="badge yellow">الآجل مقفول</span>':''}</div></div><b>${fmt(line)}</b><button class="small danger no-print" onclick="removeCart(${x.product_id})">حذف</button></div>`;}).join('');
 const groupHtml=Object.values(groups).map(g=>`<div class="row between"><span>${esc(g.supplier)} — إجمالي المنتجات بسعر المحل ${fmt(g.goods)}</span><span>${deliveryMode==='pickup'?'استلام مباشر — لا تُضاف أجرة توصيل':`أجرة توصيل واحدة للمورد: ${g.unknown?'تحتاج إلى استكمال الموقع أو تعريفة السيارة':fmt(g.delivery)}${!g.unknown?' · المسافة التقديرية '+Number(g.dist||0).toFixed(1)+' كم':''}`}</span></div>`).join('');
 const estimatedTotal=goods+delivery;
 const selector=`<div class="card no-print"><h3>طريقة الاستلام</h3><label>اختر طريقة استلام الطلبية</label><select id="deliveryMode" onchange="deliveryMode=this.value;drawCart()"><option value="delivery" ${deliveryMode==='delivery'?'selected':''}>توصيل إلى المحل</option><option value="pickup" ${deliveryMode==='pickup'?'selected':''}>استلام مباشر من المورد</option></select><div id="collectionMethodBox" ${deliveryMode==='pickup'?'class="hidden"':''}><label>طريقة تسوية مبلغ التسليم</label><select id="collectionMethod" onchange="collectionMethod=this.value;drawCart()"><option value="cash" ${collectionMethod==='cash'?'selected':''}>كاش — السائق يستلم المبلغ عند الباب</option><option value="transfer" ${collectionMethod==='transfer'?'selected':''}>حوالة — السائق لا يستلم أموالًا؛ تُرفق الحوالة لتأكيدها عبر الخزينة</option></select><p class="muted">اختيار الحوالة لا يعتبر إثباتًا للدفع؛ تبقى الفاتورة معلقة حتى إرسال إثبات واعتماده من المالك أو المحاسب.</p></div><div id="vehicleChoiceBox" ${deliveryMode==='pickup'?'class="hidden"':''}><label>فئة سيارة التوصيل</label><select id="vehicleChoice" onchange="vehicleChoice=this.value;drawCart()"><option value="small" ${vehicleChoice==='small'?'selected':''}>حمولة صغيرة</option><option value="medium" ${vehicleChoice==='medium'?'selected':''}>حمولة متوسطة</option><option value="large" ${vehicleChoice==='large'?'selected':''}>حمولة كبيرة</option><option value="supplier" ${vehicleChoice==='supplier'?'selected':''}>اترك تحديد السيارة للمورد</option></select><p class="muted">السعر الظاهر هنا شامل نسبة المنصة. أجرة التوصيل معروضة لكل مورد مرة واحدة. إذا تركت فئة السيارة للمورد، فالمبلغ تقديري محافظ ويُثبّت حسب السياسة المعروضة قبل تنفيذ الطلب؛ ولا تظهر نسبة المنصة كبند مستقل.</p></div></div>`;
 const totalDisplay=deliveryMode==='delivery'&&unknown?'غير مكتمل — لا يمكن تأكيد الطلب حتى تتوفر إحداثيات الطرفين وتعريفة التوصيل المناسبة':fmt(estimatedTotal);
 const body=rows.length?`${rowHtml}${selector}<h3 style="margin-top:14px">ملخص التكلفة</h3>${groupHtml}<div class="notice ${unknown&&deliveryMode==='delivery'?'warn':''}"><b>إجمالي المنتجات بالسعر النهائي للمحل: ${fmt(goods)}</b><br>${deliveryMode==='delivery'?`إجمالي التوصيل: ${unknown?'غير مكتمل':fmt(delivery)}`:'إجمالي التوصيل: 0.000 د.ل (استلام مباشر)'}<br><b>الإجمالي المتوقع للمحل: ${totalDisplay}</b><p class="muted">لا تظهر نسبة المنصة أو قيمة مكسبها في شاشة المحل أو فاتورته. التوصيل ليس مجانيًا؛ لا تضاف أجرة نقل عند اختيار الاستلام المباشر فقط. تقدير المسافة مبني على إحداثيات الطرفين ومعامل مسار تقريبي.</p></div><button onclick="checkoutCart()">تأكيد الطلبية</button>`:'<p class="muted">السلة فارغة. أضف منتجات من مورد واحد أو عدة موردين.</p>';
 box.innerHTML=`<h2>سلة متعددة الموردين (${rows.length} صنف)</h2>${body}`;
}
async function checkoutCart(){if(!cart.length)return toast('السلة فارغة',false);if(deliveryMode==='delivery'){const rows=cart.map(x=>products.find(p=>p.id===x.product_id)).filter(Boolean);for(const p of rows){if(p.distance_estimate_km==null)return toast('أكمل إحداثيات موقع المحل والمورد قبل طلب التوصيل، أو اختر الاستلام المباشر.',false);const quote=p.delivery_quotes?.[vehicleChoice==='supplier'?'supplier':vehicleChoice];if(quote==null||!Number.isFinite(Number(quote))||Number(quote)<=0)return toast('لا توجد تعريفة توصيل مناسبة لهذه الفئة؛ اختر فئة أخرى أو الاستلام المباشر.',false);}}const r=await api('orders/create-batch',{items:cart,delivery_mode:deliveryMode,collection_method:deliveryMode==='delivery'?collectionMethod:'cash',vehicle_type:deliveryMode==='delivery'?vehicleChoice:'supplier'});if(r.error)return toast(r.error,false);alert('تم تسجيل السلة رقم '+r.batch_id+'\nعدد الطلبات الفرعية: '+r.orders.length+(deliveryMode==='pickup'?'\nطريقة الاستلام: مباشر. يؤكد المحل الاستلام بعد تجهيز المورد.':'\nطريقة الاستلام: توصيل. تظهر الشحنة للسائقين بعد تأكيد المورد وفئة السيارة.'));cart=[];await vMarket();go('orders');}

  let actions='';

  }

async function vInvoices(){const d=await api('orders/get');if(d.error)return toast(d.error,false);$('content').innerHTML=`<h2>${me.role==='shop'?'فواتيري وديوني':me.role==='supplier'?'فواتير المورد والتحصيل':'كل الفواتير'}</h2>${(d.invoices||[]).map(i=>`<div class="card printable-card" id="invoice-${i.id}"><div class="row between"><b>فاتورة #${i.id} · ${esc(me.role==='shop'?i.supplier_name:i.shop_name)}</b><span class="badge ${i.status==='paid'?'green':i.status==='partial'?'yellow':'redbg'}">${i.status==='paid'?'مسددة':i.status==='partial'?'مسددة جزئيًا':'غير مسددة'}</span></div><div class="jobfees">${me.role==='shop'?`<div>قيمة المنتجات بسعر البيع النهائي<b>${fmt(i.customer_goods_total??(i.goods_total+i.app_fee))}</b></div>`:`<div>قيمة المنتجات<b>${fmt(i.goods_total)}</b></div>`}${me.role==='shop'?`<div>أجرة التوصيل<b>${fmt(i.delivery_fee)}</b></div>`:''}${me.role==='owner'?`<div>دخل المنصة من المنتجات<b>${fmt(i.app_fee)}</b></div><div>مكسب التطبيق الصافي<b>${fmt(i.app_profit)}</b></div><div>مستحق السائق<b>${fmt(i.driver_earning)}</b></div>`:''}<div>إجمالي الفاتورة<b>${fmt(i.total)}</b></div><div>المدفوع<b>${fmt(i.paid)}</b></div><div>المتبقي<b>${fmt(i.total-i.paid)}</b></div></div><div class="row no-print">${['owner','accountant'].includes(me.role)&&i.status!=='paid'?`<button class="small" onclick="payInvoice(${i.id},${(i.total-i.paid)/1000})">تسجيل مبلغ دخل الخزينة</button>`:''}${me.role==='supplier'&&i.status!=='paid'?`<button class="small amber" onclick="createDebtClaim(${i.id},${((i.total-i.paid)/1000).toFixed(3)})">مطالبة بدين</button>`:''}<button class="small secondary" onclick="printCard(this)">طباعة الفاتورة</button></div></div>`).join('')||'<p class="muted">لا توجد فواتير.</p>'}`;}
async function payInvoice(id,max){const amount=prompt('المبلغ المستلم بالدينار (الحد '+max.toFixed(3)+')',max.toFixed(3));if(amount===null)return;const method=prompt('طريقة الدفع: cash أو transfer أو other','cash');if(method===null)return;const reference=prompt('مرجع الدفع (اختياري)','')||'';const r=await api('invoices/pay',{invoice_id:id,amount,method:method.trim(),reference});if(r.error)return toast(r.error,false);toast('تم تسجيل الدفعة');vInvoices();}
async function vCollections(){const d=await api(me.role==='rep'?'rep/collections':'collections/list');if(d.error)return toast(d.error,false);const rows=Array.isArray(d)?d:[];$('content').innerHTML=`<h2>${me.role==='rep'?'تقارير التحصيل التي سجلتها':'تقارير التحصيل للمراجعة'}</h2>${rows.map(x=>`<div class="card"><div class="row between"><b>تقرير #${x.id} · ${esc(x.shop_name)}</b><span class="badge ${x.status==='approved'?'green':x.status==='rejected'?'redbg':'yellow'}">${x.status==='approved'?'معتمد':x.status==='rejected'?'مرفوض':'قيد المراجعة'}</span></div><p class="muted">${x.rep_name?'المندوب: '+esc(x.rep_name)+' · ':''}فاتورة #${x.invoice_id} · المورد ${esc(x.supplier_name)} · المبلغ ${fmt(x.amount)} · ${esc(x.method)}</p><p>${esc(x.note||'')}</p>${x.status==='pending'&&me.role!=='rep'?`<div class="row"><button class="small" onclick="reviewCollection(${x.id},'approve')">اعتماد التحصيل</button><button class="small danger" onclick="reviewCollection(${x.id},'reject')">رفض</button></div>`:''}</div>`).join('')||'<p class="muted">لا توجد تقارير تحصيل.</p>'}`;}
async function reviewCollection(id,action){if(!confirm(action==='approve'?'اعتماد التحصيل وتحديث الدين؟':'رفض تقرير التحصيل؟'))return;const r=await api('collections/review',{id,action});if(r.error)return toast(r.error,false);toast('تمت مراجعة التقرير');vCollections();}

// دفتر العهد النقدية والتسليمات بين الأطراف.
const custodyStatusNames={held_by_driver:'العهدة لدى السائق',held_by_rep:'العهدة لدى المندوب',awaiting_owner_receipt:'بانتظار تأكيد استلام المالك',held_by_owner:'العهدة لدى المالك',held_by_rep_for_supplier:'عهدة لدى المندوب لتسليم المورد',awaiting_supplier_confirmation:'بانتظار تأكيد المورد',received_by_supplier:'استلمها المورد',closed:'مغلقة'};
async function vCustody(){const rows=await api('cash-custody/list');if(rows.error)return toast(rows.error,false);const held=(rows||[]).reduce((sum,x)=>sum+Number(x.amount||0),0);$('content').innerHTML=`<h2>${['owner','accountant'].includes(me.role)?'دفتر الخزينة والعهد المالية':'العهد النقدية المسجلة على حسابي'}</h2><div class="grid"><div class="card stat"><b>${fmt(held)}</b>${['owner','accountant'].includes(me.role)?'قيمة العهد الظاهرة في دفتر الخزينة':'قيمة العهد المسجلة على حسابك'}</div><div class="card stat"><b>${rows.length}</b>سجلات العهد</div></div><div class="notice">لا يُغلق سجل العهد بمجرد أن يقول الطرف إنه سلّم المال. يجب على المستلم تأكيد الاستلام داخل النظام. يحتفظ كل طرف بسجل ما تسلّمه وما سلّمه.</div>${['owner','accountant'].includes(me.role)?`<div class="card no-print"><h3>تسجيل مبلغ استُلم فعليًا في الخزينة</h3><div class="formgrid"><div><label>المبلغ (د.ل)</label><input id="treasury-amount" type="number" min="0.001" step="0.001"></div><div><label>طريقة الاستلام</label><select id="treasury-method"><option value="cash">نقدًا</option><option value="transfer">حوالة مؤكدة</option><option value="other">أخرى</option></select></div><div><label>الغرض</label><input id="treasury-purpose" value="إيداع في الخزينة"></div><div><label>مرجع / ملاحظة</label><input id="treasury-note"></div></div><button onclick="recordTreasuryDeposit()">تسجيل استلام الخزينة</button></div>`:''}${rows.map(c=>`<div class="card printable-card"><div class="row between"><b>عهدة #${c.id} · ${esc(c.purpose||'تحصيل')}</b><span class="badge ${['held_by_driver','held_by_rep','awaiting_owner_receipt','held_by_rep_for_supplier','awaiting_supplier_confirmation'].includes(c.status)?'yellow':'green'}">${custodyStatusNames[c.status]||esc(c.status)}</span></div><div class="muted">المحل: ${esc(c.shop_business||c.shop_name||'—')} · المورد: ${esc(c.supplier_business||c.supplier_name||'—')}</div><div class="jobfees"><div>إجمالي المبلغ<b>${fmt(c.amount)}</b></div>${['owner','accountant'].includes(me.role)?`<div>حصة المورد<b>${fmt(c.supplier_component)}</b></div><div>مستحق السائق<b>${fmt(c.driver_component)}</b></div><div>حصة المنصة<b>${fmt(c.platform_component)}</b></div><div>حائز العهدة<b>${esc(c.holder_name||'—')}</b></div>`:''}<div>تاريخ السجل<b>${esc(c.created_at||'')}</b></div></div><p class="muted">${esc(c.note||'')}</p><div class="row no-print">${['owner','accountant'].includes(me.role)&&c.current_holder_id!==me.id&&['held_by_driver','held_by_rep','awaiting_owner_receipt'].includes(c.status)?`<button onclick="receiveCustody(${c.id})">تأكيد استلام العهدة من ${esc(c.holder_name||'الطرف')}</button>`:''}${['driver','rep'].includes(me.role)&&c.current_holder_id===me.id&&['held_by_driver','held_by_rep'].includes(c.status)?`<button onclick="requestCustodyHandover(${c.id})">تسجيل تسليم العهدة للمالك</button>`:''}<button class="small secondary" onclick="printCard(this)">طباعة سجل العهدة</button></div></div>`).join('')||'<div class="card">لا توجد عهد مالية مسجلة حاليًا.</div>'}`;}
async function receiveCustody(id){if(!confirm('هل استلمت المبلغ فعليًا وأصبحت العهدة بحوزتك؟'))return;const r=await api('cash-custody/owner-receive',{id});if(r.error)return toast(r.error,false);toast('تم تأكيد استلام العهدة');vCustody();}
async function requestCustodyHandover(id){if(!confirm('تأكيد أنك سلّمت العهدة للمالك وطلبت منه تأكيد الاستلام؟ لا تغلق العهدة قبل تأكيد المالك.'))return;const r=await api('cash-custody/request-handover',{id});if(r.error)return toast(r.error,false);toast('أُرسل طلب التسليم وينتظر تأكيد المالك');vCustody();}

async function vRemittances(){const rows=await api('supplier-remittances/list');if(rows.error)return toast(rows.error,false);let extra='';if(['owner','accountant'].includes(me.role)){const [cust,users]=await Promise.all([api('cash-custody/list'),api('users/list')]);if(cust.error||users.error)return toast(cust.error||users.error,false);const eligible=(cust||[]).filter(c=>Number(c.current_holder_id)===Number(me.id)&&c.status==='held_by_owner'&&Number(c.supplier_component)>0);const reps=(users||[]).filter(x=>x.role==='rep'&&x.active);extra=`<div class="card"><h3>إنشاء توريد لمورد من عهدة استلمها المالك</h3><p class="muted">لا ينشأ تحويل للمورد إلا من عهدة موجودة فعليًا لدى المالك. يبقى المستحق مفتوحًا إلى أن يؤكد المورد الاستلام.</p><div class="formgrid"><div><label>مصدر العهدة</label><select id="remit-custody">${eligible.map(c=>`<option value="${c.id}" data-max="${Number(c.supplier_component)/1000}" data-supplier="${c.supplier_id}">عهدة #${c.id} · ${esc(c.supplier_business||c.supplier_name||'مورد')} · المتاح للمورد ${fmt(c.supplier_component)}</option>`).join('')}</select></div><div><label>مبلغ التوريد (د.ل)</label><input id="remit-amount" type="number" min="0.001" step="0.001" placeholder="مبلغ التحويل"></div><div><label>طريقة التوريد</label><select id="remit-method"><option value="transfer">تحويل بنكي مباشر</option><option value="cash_direct">نقدًا مباشرة للمورد</option><option value="cash_via_rep">تسليم نقدي بواسطة مندوب</option></select></div><div id="remit-rep-wrap"><label>المندوب المستلم (إذا عبر مندوب)</label><select id="remit-rep">${reps.map(x=>`<option value="${x.id}">${esc(x.name)} · ${esc(x.phone)}</option>`).join('')}</select></div><div><label>مرجع التحويل</label><input id="remit-reference" placeholder="رقم عملية التحويل إن وجد"></div><div><label>ملاحظة</label><input id="remit-note" placeholder="ملاحظة داخلية"></div></div><button onclick="createRemittance()" ${eligible.length?'':'disabled'}>إنشاء توريد للمورد</button>${eligible.length?'':'<p class="muted">لا توجد عهدة لدى المالك تحتوي على حصة مورد متاحة. أكد استلام النقد أولًا في صفحة العهد المالية.</p>'}</div>`;}
$('content').innerHTML=`<h2>${me.role==='owner'?'توريد مستحقات الموردين':me.role==='supplier'?'التحويلات الواردة من المنصة':'المبالغ المسندة إليّ لتسليمها للمورد'}</h2>${extra}<div class="notice">حالة التوريد لا تصبح «مستلمًا» إلا بعد تأكيد المورد. إذا سلّم المالك المال لمندوب، تبقى العهدة عليه حتى يسجل المندوب التسليم ويؤكد المورد استلامه.</div>${(rows||[]).map(r=>`<div class="card printable-card"><div class="row between"><b>توريد #${r.id} · ${esc(r.supplier_business||r.supplier_name)}</b><span class="badge ${r.status==='received'?'green':'yellow'}">${r.status==='received'?'تم تأكيد الاستلام':r.status==='with_rep'?'العهدة مع المندوب':'بانتظار تأكيد المورد'}</span></div><p class="muted">الفاتورة: ${r.invoice_number?'#'+r.invoice_number:'—'} · المحل: ${esc(r.shop_name||'—')} · المبلغ: <b>${fmt(r.amount)}</b> · الطريقة: ${esc(r.method)}</p>${r.rep_name?`<p>المندوب المسند: ${esc(r.rep_name)}</p>`:''}<p>${esc(r.note||'')}</p><div class="row no-print">${me.role==='rep'&&r.status==='with_rep'?`<button onclick="handoverRemittance(${r.id})">تأكيد تسليم المبلغ للمورد وطلب تأكيده</button>`:''}${me.role==='supplier'&&r.status==='awaiting_supplier_confirmation'?`<button onclick="confirmRemittance(${r.id})">تأكيد استلام المبلغ</button>`:''}<button class="small secondary" onclick="printCard(this)">طباعة سجل التوريد</button></div></div>`).join('')||'<div class="card">لا توجد تحويلات مسجلة حتى الآن.</div>'}`;if($('remit-method'))$('remit-method').onchange=()=>{$('remit-rep-wrap').classList.toggle('hidden',$('remit-method').value!=='cash_via_rep');};}
async function createRemittance(){const custody_id=Number($('remit-custody')?.value),amount=$('remit-amount')?.value,method=$('remit-method')?.value;if(!custody_id)return toast('اختر عهدة استلمها المالك',false);const r=await api('supplier-remittances/create',{custody_id,amount,method,rep_id:Number($('remit-rep')?.value||0),reference:$('remit-reference')?.value||'',note:$('remit-note')?.value||''});if(r.error)return toast(r.error,false);toast('تم إنشاء التوريد حسب طريقة الدفع المختارة');vRemittances();}
async function handoverRemittance(id){if(!confirm('هل سلمت المبلغ إلى المورد فعليًا؟ سيبقى بانتظار تأكيد المورد.'))return;const r=await api('supplier-remittances/handover',{id});if(r.error)return toast(r.error,false);toast('تم تسجيل التسليم بانتظار تأكيد المورد');vRemittances();}
async function confirmRemittance(id){if(!confirm('أكد فقط إذا استلمت المبلغ بالفعل.'))return;const r=await api('supplier-remittances/confirm',{id});if(r.error)return toast(r.error,false);toast('تم تأكيد استلام المورد');vRemittances();}

async function vPayouts(){const p=await api('payouts/list');if(p.error)return toast(p.error,false);let extra='';if(['owner','accountant'].includes(me.role)){const [elig,users,cust]=await Promise.all([api('payouts/eligible'),api('users/list'),api('cash-custody/list')]);if(elig.error||users.error||cust.error)return toast(elig.error||users.error||cust.error,false);const people=(users||[]).filter(x=>['driver','rep'].includes(x.role)&&x.active),cash=(cust||[]).filter(x=>x.status==='held_by_owner'&&Number(x.current_holder_id)===Number(me.id));extra=`<div class="card"><h3>صرف مستحقات مستحقة</h3><div class="formgrid"><div><label>المستفيد</label><select id="payout-user">${people.map(x=>{const e=(elig.rows||[]).find(z=>Number(z.id)===Number(x.id));return `<option value="${x.id}" data-available="${Number(e?.available||0)/1000}">${esc(x.name)} — ${esc(ROLES[x.role])} · المتاح ${fmt(e?.available||0)}</option>`}).join('')}</select></div><div><label>المبلغ (د.ل)</label><input id="payout-amount" type="number" min="0.001" step="0.001" placeholder="المبلغ المصروف"></div><div><label>طريقة الدفع</label><select id="payout-method"><option value="cash">نقدًا</option><option value="transfer">تحويل بنكي</option><option value="other">أخرى</option></select></div><div><label>مصدر العهدة من الخزينة (إلزامي)</label><select id="payout-custody"><option value="">اختر العهدة التي استلمتها الخزينة</option>${cash.map(c=>`<option value="${c.id}">عهدة #${c.id} · ${fmt(c.amount)} · ${esc(c.holder_name||'المالك')}</option>`).join('')}</select></div><div><label>رقم مرجعي</label><input id="payout-reference" placeholder="اختياري"></div><div><label>سبب الصرف</label><input id="payout-reason" value="صرف مستحق مثبت" placeholder="سبب الصرف"></div></div><button onclick="createPayout()">تسجيل صرف المستحق</button><div class="notice">عند التسجيل تصبح الدفعة «مرسلة بانتظار تأكيد المستفيد»، وتُحتسب ضمن المستحقات المحجوزة حتى لا تُصرف مرتين.</div></div><h3>ملخص المستحقات لكل سائق ومندوب</h3><div class="grid">${(elig.rows||[]).map(x=>`<div class="card stat"><b>${fmt(x.available)}</b>${esc(x.name)} · ${esc(ROLES[x.role])}<p class="muted">المكتسب: ${fmt(x.earned)} · المدفوع/المرسل: ${fmt(x.paid)}</p></div>`).join('')}</div>`;}
$('content').innerHTML=`<h2>${me.role==='owner'?'سجل صرف المستحقات': 'مستحقاتي المالية'}</h2>${extra}<div class="notice">يرى المالك كل سجل صرف. ويرى السائق أو المندوب ما يخصه فقط، ويمكنه تأكيد استلام مستحقه.</div>${(p||[]).map(x=>`<div class="card printable-card"><div class="row between"><b>صرف #${x.id} · ${esc(x.recipient_name)} (${esc(ROLES[x.recipient_role]||x.recipient_role)})</b><span class="badge ${x.status==='confirmed'?'green':'yellow'}">${x.status==='confirmed'?'تم تأكيد الاستلام':'مرسل بانتظار تأكيد المستفيد'}</span></div><div class="jobfees"><div>المبلغ<b>${fmt(x.amount)}</b></div><div>طريقة الدفع<b>${esc(x.method)}</b></div><div>التاريخ<b>${esc(x.created_at||'')}</b></div></div><p>${esc(x.note||x.reason||'')}</p><div class="row no-print">${['driver','rep'].includes(me.role)&&x.status==='sent'?`<button onclick="confirmPayout(${x.id})">تأكيد استلام المستحق</button>`:''}<button class="small secondary" onclick="printCard(this)">طباعة إيصال الصرف</button></div></div>`).join('')||'<div class="card">لا توجد عمليات صرف.</div>'}`;}
async function createPayout(){const r=await api('payouts/create',{recipient_user_id:Number($('payout-user').value),amount:$('payout-amount').value,method:$('payout-method').value,custody_id:$('payout-custody').value||undefined,reference:$('payout-reference').value,note:$('payout-reason').value});if(r.error)return toast(r.error,false);toast('سُجل صرف المستحق وأُرسل للمستفيد لتأكيد الاستلام');vPayouts();}
async function confirmPayout(id){if(!confirm('هل استلمت هذا المبلغ بالفعل؟'))return;const r=await api('payouts/confirm',{id});if(r.error)return toast(r.error,false);toast('تم تأكيد استلام المستحق');vPayouts();}

// طلبات تسديد الدين من المحل: رفع إيصال خاص، والخصم من الدين لا يحدث إلا بعد الاعتماد.
async function vDebtPayments(){
 const list=await api('debt-payments/list');if(list.error)return toast(list.error,false);
 if(me.role==='shop'){
  const invs=await api('orders/get');if(invs.error)return toast(invs.error,false);
  const open=(invs.invoices||[]).filter(i=>Number(i.total)>Number(i.paid));

const claimStatusLabel={new:'جديدة بانتظار الإسناد',assigned:'مسندة',in_progress:'قيد المتابعة',follow_up:'تحتاج متابعة لاحقة',disputed:'متنازع عليها',closed:'مغلقة'};
async function vClaims(){const rows=await api('debt-claims/list');if(rows.error)return toast(rows.error,false);
 if(me.role==='supplier'){
  const bills=await api('orders/get');if(bills.error)return toast(bills.error,false);const outstanding=(bills.invoices||[]).filter(i=>Number(i.total)>Number(i.paid));

 }
 if(me.role==='owner'){
  const users=await api('users/list');if(users.error)return toast(users.error,false);const reps=users.filter(x=>x.role==='rep'&&x.active),drivers=users.filter(x=>x.role==='driver'&&x.active);
  $('content').innerHTML=`<h2>إدارة مطالبات الديون</h2><div class="notice">تظهر المواقع وبيانات الاتصال لمالك المنصة، وللسائق والمندوب عند إسناد المطالبة إليهما فقط.</div>${rows.map(c=>`<div class="card printable-card"><div class="row between"><b>مطالبة #${c.id} · ${esc(c.shop_business||c.shop_name)}</b><span class="badge ${c.status==='new'?'yellow':c.status==='disputed'?'redbg':'bluebg'}">${claimStatusLabel[c.status]||esc(c.status)}</span></div><p>المورد: ${esc(c.supplier_business||c.supplier_name)} · الفاتورة #${c.invoice_id} · مبلغ المطالبة ${fmt(c.amount)} · باقي الفاتورة ${fmt(c.invoice_total-c.invoice_paid)}</p><div class="row">${c.shop_location?`<a class="location" target="_blank" rel="noopener" href="${esc(c.shop_location)}">موقع المحل</a>`:''}${c.supplier_location?`<a class="location" target="_blank" rel="noopener" href="${esc(c.supplier_location)}">موقع المورد</a>`:''}</div><p class="muted">مندوب المتابعة: ${esc(c.rep_name||'غير مسند')} · السائق: ${esc(c.driver_name||'غير مسند')}</p>${['new','assigned','in_progress','follow_up'].includes(c.status)?`<div class="formgrid"><div><label>إسناد للمندوب</label><select id="claim-rep-${c.id}">${reps.map(x=>`<option value="${x.id}" ${x.id===c.rep_id?'selected':''}>${esc(x.name)} — ${esc(x.phone)}</option>`).join('')}</select></div><div><label>إسناد للسائق</label><select id="claim-driver-${c.id}">${drivers.map(x=>`<option value="${x.id}" ${x.id===c.driver_id?'selected':''}>${esc(x.name)} — ${esc(x.phone)} · ${vehicleNames[x.vehicle_type]||x.vehicle_type}</option>`).join('')}</select></div></div><button onclick="assignDebtClaim(${c.id})">حفظ الإسناد للطرفين</button>`:''}<p>${esc(c.outcome_note||c.note||'')}</p><button class="small secondary" onclick="claimHistory(${c.id})">سجل المتابعة</button><button class="small secondary" onclick="printCard(this)">طباعة المطالبة</button></div>`).join('')||'<div class="card">لا توجد مطالبات بعد. ينشئ المورد المطالبة من حسابه.</div>'}`;return;
 }

function claimCard(c,canUpdate){const links=`${c.shop_location?`<a class="location" target="_blank" rel="noopener" href="${esc(c.shop_location)}">موقع المحل</a>`:''} ${c.supplier_location?`<a class="location" target="_blank" rel="noopener" href="${esc(c.supplier_location)}">موقع المورد</a>`:''}`;return `<div class="card printable-card"><div class="row between"><b>مطالبة #${c.id} · ${esc(c.shop_business||c.shop_name)}</b><span class="badge ${c.status==='disputed'?'redbg':c.status==='new'?'yellow':'bluebg'}">${claimStatusLabel[c.status]||esc(c.status)}</span></div><p>المورد: ${esc(c.supplier_business||c.supplier_name)} · الفاتورة #${c.invoice_id}</p><div class="notice"><b>مبلغ التحصيل المطلوب: ${fmt(c.amount)}</b><div class="muted">رصيد الفاتورة الحالي: ${fmt(c.invoice_total-c.invoice_paid)} — لا يُعتبر الدين مسددًا حتى تسجل دفعة وتُعتمد.</div></div><div class="row">${links}</div><p class="muted">هاتف المحل: ${esc(c.shop_phone||'')} · هاتف المورد: ${esc(c.supplier_phone||'')}</p><p>${esc(c.outcome_note||c.note||'')}</p>${c.next_followup_date?`<p class="muted">موعد المتابعة التالي: ${esc(c.next_followup_date)}</p>`:''}${canUpdate&&c.status!=='closed'?`<button onclick="updateDebtClaim(${c.id})">تسجيل نتيجة المتابعة</button>`:''}<button class="small secondary" onclick="claimHistory(${c.id})">سجل المتابعة</button><button class="small secondary" onclick="printCard(this)">طباعة المطالبة</button></div>`;}
async function createDebtClaim(invoice_id,remaining){const amount=prompt('قيمة المطالبة بالدينار (المتبقي '+remaining+')',remaining);if(amount===null)return;const note=prompt('ملاحظة للمندوب والسائق (اختياري)','')||'';const r=await api('debt-claims/create',{invoice_id,amount,note});if(r.error)return toast(r.error,false);toast('تم تسجيل المطالبة. ستظهر للمالك للإسناد.');vClaims();}
async function assignDebtClaim(id){const rep_id=Number($('claim-rep-'+id).value),driver_id=Number($('claim-driver-'+id).value);if(!rep_id||!driver_id)return toast('اختر مندوبًا وسائقًا',false);const r=await api('debt-claims/assign',{id,rep_id,driver_id});if(r.error)return toast(r.error,false);toast('تم إسناد المطالبة للمندوب والسائق');vClaims();}
async function updateDebtClaim(id){const action=prompt('اختر نتيجة المتابعة بكتابة أحد الخيارات:\nvisited = تمت الزيارة\npromise_to_pay = وعد بالسداد\nno_answer = لم يستجب\ndisputed = اعتراض على الدين\nfollow_up = متابعة لاحقة\nvisit_failed = تعذر الوصول','visited');if(action===null)return;const allowed=['visited','promise_to_pay','no_answer','disputed','follow_up','visit_failed'];if(!allowed.includes(action.trim()))return toast('النتيجة غير صحيحة',false);let next_followup_date='';if(['promise_to_pay','follow_up'].includes(action.trim())){next_followup_date=prompt('تاريخ المتابعة YYYY-MM-DD','');if(!next_followup_date)return toast('تاريخ المتابعة مطلوب',false);}const note=prompt('اكتب تفاصيل الزيارة أو الوعد بالسداد','')||'';const r=await api('debt-claims/update',{id,action:action.trim(),next_followup_date,note});if(r.error)return toast(r.error,false);toast('تم حفظ نتيجة المتابعة');vClaims();}
async function claimHistory(id){const rows=await api('debt-claims/history',{id});if(rows.error)return toast(rows.error,false);openModal('سجل المتابعة للمطالبة #'+id,rows.map(x=>`<div class="card"><b>${esc(x.actor_name)} · ${esc(x.action)}</b><p>${esc(x.note||'')}</p><small>${esc(x.created_at)} ${x.next_followup_date?'· التالي: '+esc(x.next_followup_date):''}</small></div>`).join('')||'<p>لا توجد تحديثات.</p>');}

async function vDriverJobs(){const d=await api('delivery/list');if(d.error)return toast(d.error,false);const available=d.groups||[];const assigned=d.jobs||[];$('content').innerHTML=`<div class="row between no-print"><h2>مهامي والتوصيلات</h2><button class="small secondary" onclick="vDriverJobs()">تحديث المهام الآن</button></div><h3>طلبات توصيل متاحة لفئة سيارتك</h3>${available.map(g=>`<div class="card printable-card"><div class="row between"><b>شحنة متاحة #${esc(g.batch_id.slice(0,8))}</b><span class="badge bluebg">جاهزة لقبول السائق</span></div><p class="muted">فئة السيارة: ${vehicleNames[g.selected_vehicle_type]||g.selected_vehicle_type} · تظهر أسماء الأطراف ومواقعهم بعد قبول المهمة وإسنادها إليك حفاظًا على خصوصيتهم.</p><p>${g.item_count} صنف · قيمة المنتجات بسعر المحل ${fmt(g.customer_goods_total??g.goods_total)} · المسافة المقدرة ${Number(g.distance_estimate_km).toFixed(1)} كم</p><div class="price">أجرة التوصيل المثبتة على المحل: ${fmt(g.delivery_quote)} </div><div class="notice"><b>${g.collection_method==='transfer'?'المطلوب تحصيله نقدًا من المحل: 0.000 د.ل':'المبلغ النقدي المتوقع استلامه من المحل: '+fmt(g.cash_due_from_shop)}</b><div class="muted">${g.collection_method==='transfer'?'لا تستلم نقدًا من المحل عند التسليم. تسوية الحوالة وإثباتها تتم عبر الخزينة.':'يشمل قيمة المنتجات النقدية بسعر المحل (إن وجدت) + أجرة التوصيل كاملة. البضائع الآجلة تبقى دينًا ولا تُحصّل نقدًا ضمن هذه القيمة.'}</div></div><div class="muted">مستحقك المتوقع من التوصيل بحسب تعريفتك: ${fmt(Math.round(Number(g.distance_estimate_km)*Number(me.cost_per_km||0)))}</div><div class="row no-print"><button onclick="claimDelivery('${g.batch_id}',${g.supplier_id})">قبول التوصيل الآن</button><button class="small secondary" onclick="printCard(this)">طباعة المهمة</button></div></div>`).join('')||'<p class="muted">لا توجد شحنات مطابقة لفئة سيارتك حاليًا. تظهر الشحنة هنا تلقائيًا بعد قبول المورد وتحديد فئة السيارة.</p>'}<h3>التوصيلات المسندة إليّ</h3>${assigned.map(j=>`<div class="card printable-card"><div class="row between"><b>مهمة #${j.id} · ${esc(j.shop_business||j.shop_name)}</b><span class="badge ${j.status==='delivered'?'green':'yellow'}">${j.status==='delivered'?'مكتملة':'قيد التوصيل'}</span></div><div class="muted">المورد: ${esc(j.supplier_business||j.supplier_name)} · السيارة: ${vehicleNames[j.vehicle_type]||j.vehicle_type} ${j.license_plate?'· لوحة '+esc(j.license_plate):''} ${j.vehicle_make?('· '+esc(j.vehicle_make)):''} ${j.vehicle_model?esc(j.vehicle_model):''} · المسافة ${Number(j.distance_km).toFixed(1)} كم</div><div class="row">${j.shop_location?`<a class="location" target="_blank" rel="noopener" href="${esc(j.shop_location)}">موقع المحل</a>`:''}${j.supplier_location?`<a class="location" target="_blank" rel="noopener" href="${esc(j.supplier_location)}">موقع المورد</a>`:''}</div><div class="jobfees"><div>مكسب التوصيل<b>${fmt(j.driver_earning)}</b></div><div>أجرة التوصيل على المحل<b>${fmt(j.delivery_fee)}</b></div><div>قيمة النقدي من البضائع<b>${fmt(j.cash_goods_due||0)}</b></div><div>إجمالي ما يجب تحصيله الآن<b>${fmt(j.collection_method==='transfer'?0:(j.cash_due_from_shop??j.delivery_fee))}</b></div></div>${j.status==='assigned'?`<label>رمز التسليم الذي يعرضه المحل</label><input id="jobotp-${j.id}" inputmode="numeric" maxlength="4" placeholder="أدخل OTP">${j.collection_method==='transfer'?'<p class="notice">طريقة الدفع حوالة: لا تستلم أموالًا من المحل؛ التسوية تتم عبر الخزينة.</p>':'<label><input type="checkbox" id="cash-'+j.id+'" style="width:auto"> أؤكد استلام إجمالي التحصيل الظاهر أعلاه من المحل (بما فيه أجرة التوصيل)</label>'}<div class="row no-print"><button onclick="completeJob(${j.id})">تأكيد التسليم</button><button class="small secondary" onclick="printCard(this)">طباعة المهمة</button></div>`:''}</div>`).join('')||'<p class="muted">لا توجد توصيلات مسندة حاليًا.</p>'}`;ensurePrintButton();if(driverPoll)clearInterval(driverPoll);driverPoll=setInterval(()=>{if(me?.role==='driver'&&tab==='orders'&&!document.querySelector('input[id^="jobotp-"]: function parseLatLngFromText(text){const s=String(text||'');let m=s.match(/@(-?\d{1,2}\.\d+),\s*(-?\d{1,3}\.\d+)/)||s.match(/[?&](?:q|query|ll|center)=(-?\d{1,2}\.\d+),\s*(-?\d{1,3}\.\d+)/)||s.match(/!3d(-?\d{1,2}\.\d+)!4d(-?\d{1,3}\.\d+)/)||s.match(/(-?\d{1,2}\.\d+)\s*,\s*(-?\d{1,3}\.\d+)/);if(!m)return null;const lat=Number(m[1]),lng=Number(m[2]);return Number.isFinite(lat)&&Number.isFinite(lng)&&Math.abs(lat)<=90&&Math.abs(lng)<=180?{lat,lng}:null;}
function extractLocationCoords(useGPS){if(useGPS){if(!navigator.geolocation)return toast('المتصفح لا يدعم تحديد الموقع',false);$('u-locationStatus').textContent='جارٍ طلب إذن تحديد الموقع…';navigator.geolocation.getCurrentPosition(pos=>{const lat=pos.coords.latitude,lng=pos.coords.longitude;$('u-lat').value=lat;$('u-lng').value=lng;if($('u-location'))$('u-location').value=`https://www.google.com/maps?q=${lat},${lng}`;$('u-locationStatus').textContent=`تم تحديد الموقع: ${lat.toFixed(6)}, ${lng.toFixed(6)}`;},()=>toast('لم يسمح المتصفح بتحديد الموقع. الصق رابط مشاركة الموقع من الخرائط.',false),{enableHighAccuracy:true,timeout:12000});return;}const c=parseLatLngFromText($('u-location')?.value);if(c){$('u-lat').value=c.lat;$('u-lng').value=c.lng;$('u-locationStatus').textContent=`تم استخراج الإحداثيات من الرابط تلقائيًا: ${c.lat.toFixed(6)}, ${c.lng.toFixed(6)}`;}else if($('u-locationStatus'))$('u-locationStatus').textContent='لم نتمكن من استخراج الإحداثيات بعد؛ الصق رابط Google Maps الذي يحتوي على دبوس الموقع أو استخدم موقعي الحالي.';}
let lastUnread=-1,audioCtx=null;
function beep(){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.frequency.value=880;g.gain.value=0.05;o.start();o.stop(audioCtx.currentTime+0.15);}catch{}}
async function refreshNotificationCount(initial=false){
 if(!me)return;
 const r=await api('notifications/unread-count');if(r.error)return;
 const n=Number(r.count||0),badge=$('notifCount');
 if(badge){badge.classList.toggle('hidden',n<1);badge.textContent=String(n);}
 document.title=(n>0?'('+n+') ':'')+'وِصلة جملة';
 const changed=initial||n!==lastUnread;lastUnread=n;
 if(!changed&&lastNotificationId)return;
 const all=await api('notifications/list');if(!Array.isArray(all))return;
 const newest=Math.max(0,...all.map(x=>Number(x.id||0)));
 if(!initial&&lastNotificationId&&newest>lastNotificationId){
  const fresh=all.filter(x=>Number(x.id)>lastNotificationId&&!x.is_read);
  fresh.slice(0,3).forEach(x=>toast('🔔 '+x.title,true));
  if(fresh.length&&'Notification' in window&&Notification.permission==='granted'){fresh.slice(0,3).forEach(x=>{try{new Notification(x.title,{body:x.message||'',tag:'wesla-'+x.id});}catch{}});}
  if(fresh.length){beep();if(navigator.vibrate)navigator.vibrate(120);}
  if(tab==='notifications')vNotifications();
 }
 lastNotificationId=Math.max(lastNotificationId,newest);
}
function startNotificationPolling(){if(notifTimer)clearInterval(notifTimer);notifTimer=setInterval(()=>refreshNotificationCount(false),12000);}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&me)refreshNotificationCount(false);});

async function vNotifications(){const rows=await api('notifications/list');if(!Array.isArray(rows))return toast(rows.error||'تعذر جلب الإشعارات',false);$('content').innerHTML=`<h2>مركز الإشعارات</h2><div class="card"><div class="row no-print"><button onclick="requestBrowserNotifications()">تفعيل تنبيهات المتصفح</button><button class="secondary" onclick="readAllNotifications()">تعليم الكل كمقروء</button><button class="secondary" onclick="vNotifications()">تحديث</button></div><div class="muted">الإشعارات داخل التطبيق دائمة؛ تنبيهات المتصفح تعمل أثناء فتح التطبيق. الإشعارات الفورية بالخلفية تحتاج إعداد Web Push على HTTPS.</div></div>${rows.map(n=>`<div class="card ${n.is_read?'':'owner-settings-highlight'}"><div class="row between"><b>${esc(n.title)}</b><span class="badge ${n.is_read?'':'yellow'}">${n.is_read?'مقروء':'جديد'}</span></div><p>${esc(n.message||'')}</p><div class="muted">${esc(n.event_type)} · ${esc(n.created_at||'')}</div><div class="row no-print"><button class="small secondary" onclick="openNotificationLink(${Number(n.id)},'${esc(n.link||'')}')">فتح الشاشة المعنية</button>${!n.is_read?`<button class="small" onclick="markNotificationRead(${Number(n.id)})">تعليم كمقروء</button>`:''}</div></div>`).join('')||'<div class="card">لا توجد إشعارات بعد.</div>'}`;}
async function requestBrowserNotifications(){if(!('Notification'in window))return toast('هذا المتصفح لا يدعم الإشعارات',false);const p=await Notification.requestPermission();toast(p==='granted'?'تم تفعيل تنبيهات المتصفح أثناء استخدام التطبيق':'لم يتم السماح بتنبيهات المتصفح',p==='granted');}
async function markNotificationRead(id){const r=await api('notifications/read',{id});if(r.error)return toast(r.error,false);await refreshNotificationCount(true);vNotifications();}
async function readAllNotifications(){const r=await api('notifications/read-all');if(r.error)return toast(r.error,false);await refreshNotificationCount(true);vNotifications();}
function openNotificationLink(id,link){api('notifications/read',{id});refreshNotificationCount(true);const map={'orders':'orders','invoices':'invoices','custody':'custody','deliveries':'deliveries','debtPayments':'debtPayments','claims':'claims','collections':'collections','remittances':'remittances','payouts':'payouts','users':'users','order-change-requests':'requests','requests':'requests','profile':'profile'};const dest=map[link]||link;if((TABS[me.role]||[]).some(x=>x[0]===dest)){go(dest);return;}go('notifications');}
async function vChangeRequests(){const rows=await api('order-change-requests/list');if(rows.error)return toast(rows.error,false);let access=[],users=[],orders=[];if(['owner','accountant'].includes(me.role)){const a=await api('service-order-access/list'),u=await api('users/list'),o=await api('orders/get');access=Array.isArray(a)?a:[];users=Array.isArray(u)?u:[];orders=o.orders||[];}
 let requestForm='';if(['shop','service_provider','subscriber'].includes(me.role)){const od=await api('orders/get');orders=od.orders||[];const selectable=orders.filter(o=>['pending','ready','shipping','delivered'].includes(o.status));requestForm=`<div class="card"><h3>إنشاء طلب موافقة</h3><div class="formgrid"><div><label>الصنف / الطلب</label><select id="cr-order">${selectable.map(o=>`<option value="${o.id}">#${o.id} · ${esc(o.product_name||'صنف')} × ${o.qty} · ${esc(o.supplier_business||o.supplier_name||'مورد')} · ${esc(o.status)}</option>`).join('')}</select></div><div><label>الإجراء</label><select id="cr-type"><option value="cancel">إلغاء</option><option value="stop">إيقاف</option><option value="return">إرجاع</option></select></div><div><label>سبب الإرجاع</label><select id="cr-reason"><option value="driver_delay">تأخر السائق</option><option value="app_error">خطأ من التطبيق</option><option value="shop_error">خطأ من المحل</option><option value="supplier_error">خطأ من مورد الجملة</option></select></div></div><p class="muted">الإلغاء والإرجاع لا ينفذان إلا بعد موافقة المالك أو المحاسب. تُطبق غرامة الإرجاع ×1.5 إلا في حالة تأخر السائق.</p><button onclick="submitOrderChangeRequest()">إرسال طلب الموافقة</button></div>`;}
 let accessForm='';if(me.role==='owner'){const serviceUsers=users.filter(x=>['service_provider','subscriber'].includes(x.role)&&x.active);const orderMap=new Map();orders.forEach(o=>{const k=o.batch_id+'|'+o.supplier_id;if(!orderMap.has(k))orderMap.set(k,o);});accessForm=`<div class="card"><h3>إسناد صلاحية طلب تغيير طلبية إلى مقدم خدمة أو مشترك</h3><div class="formgrid"><div><label>المستخدم</label><select id="access-user">${serviceUsers.map(x=>`<option value="${x.id}">${esc(x.name)} · ${esc(ROLES[x.role]||x.role)}</option>`).join('')}</select></div><div><label>الطلبية</label><select id="access-order">${[...orderMap.values()].map(o=>`<option value="${o.id}">#${o.id} · ${esc(o.shop_business||o.shop_name)} ← ${esc(o.supplier_business||o.supplier_name)} · ${esc(o.status)}</option>`).join('')}</select></div></div><button onclick="grantServiceOrderAccess()">إسناد الصلاحية</button><p class="muted">يرى المستخدم الطلبات المسندة له فقط. يظل الإلغاء والإرجاع خاضعًا للموافقة.</p></div>`;}
 const requestCards=rows.map(r=>`<div class="card"><div class="row between"><b>طلب #${r.id} — ${({cancel:'إلغاء',stop:'إيقاف',return:'إرجاع'}[r.request_type]||r.request_type)} الطلبية #${r.order_id}</b><span class="badge ${r.status==='approved'?'green':r.status==='rejected'?'redbg':'yellow'}">${r.status==='approved'?'موافق عليه':r.status==='rejected'?'مرفوض':'بانتظار الموافقة'}</span></div><p>المحل: ${esc(r.shop_business||r.shop_name)} · المورد: ${esc(r.supplier_name)} · طالب الإجراء: ${esc(r.requester_name)}</p><p>السبب: ${({driver_delay:'تأخر السائق',app_error:'خطأ من التطبيق',shop_error:'خطأ من المحل',supplier_error:'خطأ من مورد الجملة'}[r.reason]||'—')} · قيمة مطالبة التسوية: <b>${fmt(r.penalty_amount||0)}</b> · المسؤول: ${esc(r.penalty_responsible||'—')} · المستفيد: ${esc(r.penalty_beneficiary||'—')} · حالة التسوية: ${esc(r.penalty_status||'—')}</p>${['owner','accountant'].includes(me.role)&&r.status==='pending'?`<div class="row no-print"><button onclick="reviewOrderChange(${r.id},'approve')">موافقة</button><button class="danger" onclick="reviewOrderChange(${r.id},'reject')">رفض</button></div>`:''}${['owner','accountant'].includes(me.role)&&r.status==='approved'&&['pending_settlement','pending_collection'].includes(r.penalty_status)&&Number(r.penalty_amount)>0?`<button onclick="collectReturnPenalty(${r.id})">تسجيل تسوية المطالبة عبر الخزينة</button>`:''}</div>`).join('');$('content').innerHTML=`<h2>طلبات الإلغاء والإيقاف والإرجاع والموافقات</h2>${requestForm}${accessForm}${access.length?`<div class="card"><h3>الصلاحيات المسندة</h3>${access.map(a=>`<p>المستخدم: ${esc(a.user_name||'')} · الطلبية #${a.sample_order_id} · ${esc(a.shop_business||a.shop_name)} ← ${esc(a.supplier_business||a.supplier_name)}</p>`).join('')}</div>`:''}<h3>طلبات الموافقة</h3>${requestCards||'<div class="card">لا توجد طلبات موافقة.</div>'}`;}
async function submitOrderChangeRequest(){const r=await api('order-change-requests/create',{order_id:Number($('cr-order').value),request_type:$('cr-type').value,reason:$('cr-reason').value});if(r.error)return toast(r.error,false);toast(r.immediate?'تم إلغاء الصنف مباشرة قبل قبول المورد':(r.penalty_amount?'تم إرسال الطلب؛ مطالبة التسوية المحتملة '+fmt(r.penalty_amount):'تم إرسال طلب الموافقة'));vChangeRequests();}

async function vRoles(){const rows=await api('roles/list');if(!Array.isArray(rows))return toast(rows.error||'تعذر عرض الأدوار',false);availableRoleDefs=rows;$('content').innerHTML=`<h2>إدارة الأدوار والصلاحيات (RBAC)</h2><div class="card"><h3>إنشاء دور مخصص</h3><div class="formgrid"><div><label>رمز الدور (إنجليزي)</label><input id="role-code" placeholder="warehouse_viewer"></div><div><label>الاسم الظاهر</label><input id="role-label" placeholder="مراقب المستودع"></div></div><p class="muted">تبدأ الأدوار الجديدة بلا صلاحيات. امنح فقط الصلاحيات المالية أو التشغيلية اللازمة.</p><button onclick="createCustomRole()">إنشاء الدور</button></div>${rows.filter(x=>!x.is_builtin).map(r=>`<div class="card"><h3>${esc(r.label)} <span class="badge">${esc(r.code)}</span></h3><label>الصلاحيات</label><div class="grid">${['users/list','orders/get','invoices/list','notifications/list','notifications/unread-count','notifications/read','notifications/read-all','cash-custody/list','supplier-remittances/list','payouts/list','collections/list','collections/review','debt-payments/list','debt-payments/receipt','debt-payments/review','order-change-requests/list','order-change-requests/review','debt-claims/list','debt-claims/history','rep/shops','rep/stats','rep/earnings','delivery/list'].map(code=>`<label><input type="checkbox" id="perm-${r.code}-${code.replaceAll('/','_')}" data-code="${code}" style="width:auto;margin-left:5px">${esc(code)}</label>`).join('')}</div><button onclick="saveCustomRolePermissions('${esc(r.code)}')">حفظ الصلاحيات</button></div>`).join('')||'<div class="card">لا توجد أدوار مخصصة بعد.</div>'}`;for(const r of rows.filter(x=>!x.is_builtin)){let perms=[];try{perms=JSON.parse(r.permissions_json||'[]')}catch{}perms.forEach(code=>{const el=$(`perm-${r.code}-${code.replaceAll('/','_')}`);if(el)el.checked=true;});}}
async function createCustomRole(){const r=await api('roles/create',{code:$('role-code').value,label:$('role-label').value,permissions:[]});if(r.error)return toast(r.error,false);toast('تم إنشاء الدور بصلاحيات صفرية');vRoles();}
